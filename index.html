<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/horarium.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Դասացուցակ</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <img class="brand-mark" src="/src/assets/horarium.svg" alt="" aria-hidden="true" />
        <div class="header-copy">
          <p class="eyebrow">HORARIUM CLASSIUM</p>
          <h1 id="day-name">Բեռնվում է…</h1>
        </div>
        <div class="header-class">
          <span id="class-name" class="class-name"></span>
          <button id="change-class" type="button" aria-label="Փոխել դասարանի կոդը" title="Փոխել դասարանի կոդը">Միանալ</button>
        </div>
      </header>
      <form id="join-form" hidden>
        <h2>Միանալ դասարանին</h2>
        <label for="class-code">Դասարանի կոդը</label>
        <div class="join-code-row">
          <input id="class-code" type="text" autocomplete="off" spellcheck="false" required placeholder="KRMZ" maxlength="4" autocapitalize="characters" />
          <button type="submit">Ստուգել</button>
        </div>
        <p id="class-preview" role="status"></p>
        <button id="join-confirm" type="button" hidden>Միանալ</button>
        <button id="join-cancel" type="button" hidden>Չեղարկել</button>
      </form>
      <button id="retry" type="button" hidden>Կրկին փորձել</button>
      <p id="schedule-source" class="source" aria-live="polite"></p>
      <p id="settings-status" role="status"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="lesson-summary" class="lesson-summary" aria-live="polite" hidden></p>
      <div id="schedule-list" class="schedule-list"></div>
    </main>
  </body>
</html>
