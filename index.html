<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/horarium.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Դասացուցակ</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <img class="brand-mark" src="/src/assets/horarium.svg" alt="" aria-hidden="true" />
        <div class="header-copy">
          <p class="eyebrow">HORARIUM CLASSIUM</p>
          <h1 id="day-name">Բեռնվում է…</h1>
        </div>
        <span class="live-indicator"><span></span><time id="current-time">--:--</time></span>
      </header>
      <p id="schedule-source" class="source" aria-live="polite"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="lesson-summary" class="lesson-summary" aria-live="polite" hidden></p>
      <div id="schedule-list" class="schedule-list"></div>
    </main>
  </body>
</html>
